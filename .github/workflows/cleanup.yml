name: Cleanup
on:
  schedule:
    - cron: "00 1 * * 0" # 01:00m UTC
  workflow_dispatch:

jobs:
  prune-registry:
    name: Cleanup old images
    runs-on: ubuntu-latest
    permissions:
      packages: write

    strategy:
      matrix:
        package:
          - blue-calx-penguin-desktop
          - blue-calx-penguin-thinkpad
          # blue-calx-penguin-server

    steps:
      - name: Cleanup old images for ${{ matrix.package }}
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: "container"
          min-versions-to-keep: 5
          delete-only-untagged-versions: "false"
